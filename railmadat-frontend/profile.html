<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailMadat — Profile</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>
    <div class="app">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="topbar-container"></div>
            <div class="page-content">
                <div style="max-width:800px">
                    <div style="margin-bottom:24px">
                        <p class="eyebrow">PROFILE</p>
                        <h1>Your Profile</h1>
                    </div>
                    <div class="panel" id="profile-panel">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
    (function() {
        if (!AUTH.requireAuth()) return;
        async function load() {
            var el = document.getElementById('profile-panel');
            try {
                var me = await apiRequest('/auth/me');
                if (me) {
                    var roleLabel = (me.role || '').replace(/_/g,' ').replace(/\b\w/g, function(l){ return l.toUpperCase(); });
                    el.innerHTML = '<div style="padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:20px">' +
                        '<div class="field"><label>Full Name</label><input value="'+(me.full_name||'')+'" readonly style="background:var(--bg-hover)"></div>' +
                        '<div class="field"><label>Email</label><input value="'+(me.email||'')+'" readonly style="background:var(--bg-hover)"></div>' +
                        '<div class="field"><label>Role</label><input value="'+roleLabel+'" readonly style="background:var(--bg-hover)"></div>' +
                        '<div class="field"><label>Department</label><input value="'+(me.department||'')+'" readonly style="background:var(--bg-hover)"></div>' +
                        '</div>';
                }
            } catch(e) {
                el.innerHTML = '<p style="padding:24px;color:var(--text-tertiary)">Failed to load profile</p>';
            }
        }
        load();
    })();
    </script>
</body>
</html>
