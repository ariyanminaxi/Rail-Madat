<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailMadat — Bundle Approvals</title>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>
    <div class="app">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div id="topbar-container"></div>
            <div class="page-content">
                <div style="margin-bottom:24px">
                    <p class="eyebrow">BUNDLE APPROVALS</p>
                    <h1>Maintenance Bundles</h1>
                    <p style="color:var(--text-tertiary);margin-top:4px">Tasks grouped into time blocks for approval</p>
                </div>

                <div class="panel" style="max-width:1000px">
                    <div class="panel-header"><div><h3>Maintenance Bundles</h3><p>Tasks grouped into time blocks for approval</p></div></div>
                    <table class="data-table">
                        <thead><tr><th>Block ID</th><th>Section</th><th>Department</th><th>Start</th><th>End</th><th>Tasks</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody id="bundles-tbody"><tr><td colspan="8" class="loading-spinner" style="border:none"></td></tr></tbody>
                    </table>
                </div>

                <div class="footer-disclaimer">RailMadat is a decision-support system. All scheduling decisions require manager approval.</div>
            </div>
        </main>
    </div>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
    (function() {
        if (!AUTH.requireAuth()) return;

        async function loadBundles() {
            var tbody = document.getElementById('bundles-tbody');
            try {
                var blocks = await apiRequest('/scheduling/blocks') || [];
                if (blocks.length > 0) {
                    tbody.innerHTML = blocks.map(function(b) {
                        var status = b.approval_status || b.status || 'Pending';
                        var sClass = status === 'Approved' ? 'badge-green' : status === 'Rejected' ? 'badge-red' : 'badge-orange';
                        var canApprove = (status === 'Pending' || status === 'Awaiting Approval');
                        return '<tr>' +
                            '<td><strong style="color:var(--text-primary)">' + (b.block_id || '') + '</strong></td>' +
                            '<td>' + (b.section_id || '') + '</td>' +
                            '<td>' + (b.department || '') + '</td>' +
                            '<td>' + formatTime(b.start_time || b.start_window) + '</td>' +
                            '<td>' + formatTime(b.end_time || b.end_window) + '</td>' +
                            '<td>' + (b.task_count || (b.task_ids ? b.task_ids.length : 0) || '—') + '</td>' +
                            '<td><span class="badge ' + sClass + '">' + status + '</span></td>' +
                            '<td>' + (canApprove ? '<button class="btn-primary" style="font-size:11px;padding:6px 14px" onclick="approveBlock(\'' + b.block_id + '\')">Approve</button> <button class="btn-secondary" style="font-size:11px;padding:6px 10px" onclick="rejectBlock(\'' + b.block_id + '\')">Reject</button>' : '<span style="color:var(--text-tertiary)">—</span>') + '</td>' +
                            '</tr>';
                    }).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-tertiary);padding:40px"><div class="empty-state"><h3>No maintenance bundles</h3><p>Bundles will appear when tasks are grouped for scheduling.</p></div></td></tr>';
                }
            } catch(e) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--text-tertiary);padding:40px"><div class="empty-state"><h3>No bundles available</h3><p>Could not load bundles. Backend may be starting up.</p></div></td></tr>';
            }
        }

        function formatTime(t) {
            if (!t) return '—';
            try { return t.replace('T', ' ').slice(0, 16); } catch(e) { return t; }
        }

        window.approveBlock = async function(blockId) {
            try {
                await apiRequest('/scheduling/approvals', {
                    method: 'POST',
                    body: { block_id: blockId, decision: 'Approved' }
                });
                loadBundles();
            } catch(e) {
                alert('Failed to approve: ' + e.message);
            }
        };

        window.rejectBlock = async function(blockId) {
            try {
                await apiRequest('/scheduling/approvals', {
                    method: 'POST',
                    body: { block_id: blockId, decision: 'Rejected', reason: 'Rejected by manager' }
                });
                loadBundles();
            } catch(e) {
                alert('Failed to reject: ' + e.message);
            }
        };

        loadBundles();
    })();
    </script>
</body>
</html>
